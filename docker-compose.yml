version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: school_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: SchoolSecretPostgresPassword2026!
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_admin -d school_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://school_admin:SchoolSecretPostgresPassword2026!@db:5432/school_db
      SECRET_KEY: school-cloud-production-jwt-secret-key-2026
      APP_ENV: production
      DEBUG: "False"
      CORS_ORIGINS: '["http://localhost", "http://localhost:5173", "http://127.0.0.1"]'
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
